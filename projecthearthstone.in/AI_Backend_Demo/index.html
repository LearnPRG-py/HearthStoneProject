<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ASL Detector</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="wrap">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <div id="output">—</div>
    <div id="transcript"></div>

    <div id="controls">
      <label>
        Letter hold (frames)
        <input type="range" id="firstLetterFrames" min="1" max="30" value="5" />
        <span id="firstLetterFramesVal">5</span>
      </label>
      <label>
        Double-letter gap (frames)
        <input type="range" id="doubleLetterFrames" min="5" max="120" value="60" />
        <span id="doubleLetterFramesVal">60</span>
      </label>
      <button id="speak" type="button" onclick="speakTranscript()">🔊 Speak</button>
      <button id="clear" type="button">Clear</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
